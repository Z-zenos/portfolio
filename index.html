<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hoang Anh Tuan · tuanha.dev</title>
    <meta name="description" content="Hoang Anh Tuan, software engineer from Vietnam. A pixel-art portfolio set on a Hoi An street corner." />
    <meta name="theme-color" content="#fbf8f0" />
    <link rel="canonical" href="https://tuanha.dev/" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tuanha.dev/" />
    <meta property="og:site_name" content="tuanha.dev" />
    <meta property="og:title" content="Hoang Anh Tuan · Software Engineer" />
    <meta property="og:description" content="A pixel-art portfolio set on a Hoi An street corner. Quests, skills and lo-fi radio." />
    <meta property="og:image" content="https://tuanha.dev/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pixel art of a Hoi An shophouse under a peach blossom tree, beside the name Hoang Anh Tuan" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Yomogi&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      document.documentElement.classList.add('js');
      // Theme: the visitor's saved choice, otherwise the system setting. Set before first paint.
      try {
        const saved = localStorage.getItem('theme');
        document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      // The welcome screen plays once per visit and never for reduced motion.
      try {
        if (sessionStorage.getItem('intro-seen') || matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('intro-seen');
        }
      } catch {}
    </script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <a class="skip" href="#top">Skip to content</a>
    <div class="intro" data-intro aria-hidden="true">
      <img class="intro__lantern" src="assets/favicon.svg" width="72" height="96" alt="" />
      <p class="intro__ja">ようこそ</p>
      <p class="intro__domain">TUANHA.DEV</p>
      <span class="intro__bar"><i></i></span>
    </div>
    <canvas id="petals" aria-hidden="true"></canvas>

    <header class="nav" data-nav></header>

    <main id="top" tabindex="-1">
      <section class="hero">
        <div class="hero__scene">
          <canvas id="scene" role="img" aria-label="Pixel art of a Hoi An shophouse beside a red flame tree, with lanterns reflected in the river"></canvas>
        </div>
        <div class="hero__text" data-hero></div>
      </section>

      <div class="divider divider--red-green" aria-hidden="true"></div>

      <section id="about" class="section" data-kanji="伝">
        <img class="deco deco--bridge" src="assets/bridge.png" alt="" aria-hidden="true" />
        <img class="deco deco--food" src="assets/food.png" alt="" aria-hidden="true" />
        <div class="wrap"></div>
      </section>

      <div class="divider divider--navy-gold" aria-hidden="true"></div>

      <section id="exp" class="section" data-kanji="歴">
        <div class="wrap"></div>
      </section>

      <div class="divider divider--red-green" aria-hidden="true"></div>

      <section id="work" class="section" data-kanji="術">
        <img class="deco deco--street" src="assets/street.png" alt="" aria-hidden="true" />
        <div class="wrap"></div>
      </section>

      <div class="divider divider--red-navy" aria-hidden="true"></div>

      <section id="contact" class="section section--contact" data-kanji="結">
        <img class="deco deco--tree" src="assets/flametree.png" alt="" aria-hidden="true" />
        <div class="wrap"></div>
      </section>
    </main>

    <aside id="player" class="player" aria-label="Lo-fi music player">
      <span class="player__tape" aria-hidden="true"></span>
      <div class="player__bar">
        <span class="player__brand"><span class="player__radio">ラジオ</span>Vietnamese Lo-fi</span>
        <span class="player__live"><span class="player__led"></span><span data-status>PAUSED</span></span>
        <button type="button" class="player__min" data-minimize aria-expanded="true" aria-label="Minimize player"></button>
      </div>
      <div class="player__body">
        <div class="player__art" aria-hidden="true">
          <img class="player__album" src="assets/player/album.png" alt="" />
          <img class="player__cat" src="assets/player/cat.png" alt="" />
        </div>
        <div class="player__main">
          <p class="player__title" data-title>Hoi An Dusk</p>
          <p class="player__ja" data-title-ja>会安の夕暮れ</p>
          <canvas class="player__viz" data-viz width="98" height="16" aria-hidden="true"></canvas>
          <div class="player__controls">
            <button type="button" class="pbtn" data-skip="-1" aria-label="Previous track"><span class="pi pi--prev"></span></button>
            <button type="button" class="pbtn pbtn--play" data-play>PLAY</button>
            <button type="button" class="pbtn" data-skip="1" aria-label="Next track"><span class="pi pi--next"></span></button>
          </div>
        </div>
      </div>
      <div class="player__foot">
        <div class="vol" role="group" aria-label="Volume">
          <span class="vol__label">VOL</span>
          <button type="button" data-volume="low" aria-label="Low volume"></button>
          <button type="button" data-volume="med" aria-label="Medium volume"></button>
          <button type="button" data-volume="high" aria-label="High volume"></button>
        </div>
        <span class="player__dots" data-dots aria-hidden="true"></span>
      </div>
    </aside>
  </body>
</html>
