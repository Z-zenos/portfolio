<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <meta name="description" content="Pixel-art portfolio set on a Hoi An street corner." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>document.documentElement.classList.add('js');</script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <canvas id="petals" aria-hidden="true"></canvas>

    <header class="nav">
      <a class="nav__logo" href="#top"><span class="nav__mark" aria-hidden="true"></span><span data-domain></span></a>
      <nav aria-label="Primary">
        <a href="#top">Home</a>
        <a href="#about">About</a>
        <a href="#exp">Exp</a>
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
      </nav>
      <a class="btn btn--red btn--sm nav__resume" href="#contact">Resume ↗</a>
    </header>

    <main id="top">
      <section class="hero">
        <div class="hero__scene">
          <canvas id="scene" role="img" aria-label="Pixel art of a Hoi An shophouse beside a red flame tree, with lanterns reflected in the river"></canvas>
        </div>
        <div class="hero__text" data-hero></div>
      </section>

      <div class="divider divider--red-green" aria-hidden="true"></div>

      <section id="about" class="section">
        <img class="deco deco--bridge" src="assets/bridge.png" alt="" aria-hidden="true" />
        <img class="deco deco--food" src="assets/food.png" alt="" aria-hidden="true" />
        <div class="wrap"></div>
      </section>

      <div class="divider divider--navy-gold" aria-hidden="true"></div>

      <section id="exp" class="section">
        <div class="wrap"></div>
      </section>

      <div class="divider divider--red-green" aria-hidden="true"></div>

      <section id="work" class="section">
        <img class="deco deco--street" src="assets/street.png" alt="" aria-hidden="true" />
        <div class="wrap"></div>
      </section>

      <div class="divider divider--red-navy" aria-hidden="true"></div>

      <section id="contact" class="section section--contact">
        <img class="deco deco--tree" src="assets/flametree.png" alt="" aria-hidden="true" />
        <div class="wrap"></div>
      </section>
    </main>

    <aside id="player" class="player" aria-label="Lo-fi music player">
      <div class="player__icons" aria-hidden="true">
        <span class="eq"><i></i><i></i><i></i><i></i></span>
        <span class="disc"></span>
      </div>
      <div class="player__info">
        <p class="player__status"><span class="sq sq--green"></span>VIETNAMESE LO-FI · <span data-status>PAUSED</span></p>
        <p class="player__title">♫ <span data-title>Hoi An Dusk</span></p>
        <div class="player__volume" role="group" aria-label="Volume">
          <span>VOL:</span>
          <button type="button" data-volume="low">LOW</button>
          <button type="button" data-volume="med">MED</button>
          <button type="button" data-volume="high">HIGH</button>
        </div>
      </div>
      <div class="player__controls">
        <button type="button" class="btn btn--red btn--sm" data-play>PLAY</button>
        <button type="button" class="btn btn--gold btn--sm" data-next aria-label="Next track">⏭</button>
      </div>
    </aside>
  </body>
</html>
